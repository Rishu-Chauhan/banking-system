<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Deposit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dceefb, #f0f2f5); /* Soft blue gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .deposit-form {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #004aad;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
            width: 100%;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
<div class="deposit-form">
    <h2>Deposit Money</h2>
    <form th:action="@{/account/deposit}" method="post">
        <input type="hidden" name="accNo" th:value="${accNo}">

        <div class="mb-3 text-start">
            <label>Amount to Deposit</label>
            <input type="number" name="amount" class="form-control" placeholder="Enter amount" required>
        </div>

        <button type="submit" class="btn btn-success">Deposit</button>
    </form>

    <!-- Back Button -->
    <a th:href="@{/account/list}" class="btn btn-secondary mt-3">← Back to Account List</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
