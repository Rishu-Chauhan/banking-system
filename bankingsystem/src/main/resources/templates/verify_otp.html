<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | Banking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-96 text-center">
    <h2 class="text-2xl font-bold mb-6 text-blue-600">OTP Verification</h2>

    <form th:action="@{/verify-otp}" method="post" class="space-y-4">
        <input type="hidden" name="username" th:value="${username}">

        <div>
            <label for="otp" class="block text-sm font-medium text-gray-700 mb-1">
                Enter the OTP sent to your email:
            </label>
            <input type="text" id="otp" name="otp" required
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter 6-digit OTP">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
            Verify OTP
        </button>
    </form>

    <!-- ✅ Success Message -->
    <p th:if="${success}"
       th:text="${success}"
       class="mt-4 text-green-600 font-medium bg-green-100 border border-green-300 rounded-lg p-2">
    </p>

    <!-- ❌ Error Message -->
    <p th:if="${error}"
       th:text="${error}"
       class="mt-4 text-red-600 font-medium bg-red-100 border border-red-300 rounded-lg p-2">
    </p>

    <p class="mt-6 text-sm text-gray-500">Didn’t receive OTP?</p>

    <form th:action="@{/resend-otp}" method="post" class="mt-4">
        <input type="hidden" name="username" th:value="${username}">
        <button type="submit"
                class="text-blue-600 hover:underline">
            Resend OTP
        </button>
    </form>


</div>

<!-- ✅ Auto-redirect after success -->
<script th:if="${redirectUrl != null}">
    setTimeout(function () {
        window.location.href = /*[[${redirectUrl}]]*/ '/';
    }, 2000); // redirect after 2 seconds
</script>

</body>
</html>
