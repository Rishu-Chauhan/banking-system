<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Open Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f2f7ff;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-primary {
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-5 d-flex justify-content-center">
    <div class="card p-4 col-md-6">
        <div class="card-header">
            Open New Bank Account
        </div>
        <div class="card-body">
            <form th:action="@{/account/open}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Customer Name</label>
                    <input type="text" name="name" id="name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" name="phone" id="phone" class="form-control" placeholder="Enter your phone number" required>
                </div>
                <!-- ✅ Add Account Type Dropdown here -->
                <div class="mb-3">
                    <label for="accountType" class="form-label">Account Type</label>
                    <select name="accountType" id="accountType" class="form-control" required>
                        <option value="">-- Select Account Type --</option>
                        <option value="SAVING">Saving Account</option>
                        <option value="CURRENT">Current Account</option>
                        <option value="FIXED">Fixed Deposit</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Open Account</button>
                    <a href="/account/list" class="btn btn-secondary">Back to Accounts</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
