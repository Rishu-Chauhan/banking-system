<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transfer Money</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <h2 class="text-center mb-4">Transfer Money</h2>

    <!-- Display messages or errors -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/account/transfer}" method="post">
        <div class="mb-3">
            <label for="fromAccNo" class="form-label">From Account</label>
            <select name="fromAccNo" id="fromAccNo" class="form-select" required>
                <option th:each="acc : ${accounts}"
                        th:value="${acc.accountNumber}"
                        th:text="${acc.accountNumber + ' - ' + (acc.customer != null ? acc.customer.name : 'N/A')}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="toAccNo" class="form-label">To Account</label>
            <select name="toAccNo" id="toAccNo" class="form-select" required>
                <option th:each="acc : ${accounts}"
                        th:value="${acc.accountNumber}"
                        th:text="${acc.accountNumber + ' - ' + (acc.customer != null ? acc.customer.name : 'N/A')}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" name="amount" id="amount" class="form-control" placeholder="Enter amount" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary">Transfer</button>
        <a href="/account/list" class="btn btn-secondary">Back to Accounts</a>
    </form>

</div>
</body>
</html>
