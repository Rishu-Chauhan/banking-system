<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #90caf9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .dashboard-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 600px;
            max-width: 90%;
        }
        .dashboard-card h1 {
            color: #1565c0;
            font-weight: 700;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .stat-box h4 {
            color: #0d47a1;
            margin-bottom: 8px;
        }
        .logout-btn {
            background-color: #e53935;
            color: white;
        }
        .logout-btn:hover {
            background-color: #c62828;
        }
    </style>
</head>

<body>
<div class="dashboard-card text-center">
    <h1>🏦 Admin Dashboard</h1>
    <p class="lead mb-4">Welcome, Admin! You have full control over the system.</p>

    <div class="stats">
        <div class="stat-box">
            <h4>Total Customers</h4>
            <p th:text="${totalCustomers}">0</p>
        </div>
        <div class="stat-box">
            <h4>Total Accounts</h4>
            <p th:text="${totalAccounts}">0</p>
        </div>
        <div class="stat-box">
            <h4>Total Transactions</h4>
            <p th:text="${totalTransactions}">0</p>
        </div>
        <div class="stat-box">
            <h4>Total Money</h4>
            <p>₹<span th:text="${totalMoney}">0.0</span></p>
        </div>
    </div>

    <hr class="my-4">

    <div class="d-grid gap-3">
        <a href="/account/list" class="btn btn-outline-primary">View All Accounts</a>
        <a href="/account/open" class="btn btn-outline-success">Open New Account</a>
        <a href="/account/transactions" class="btn btn-outline-info">View Transactions</a>
    </div>

    <hr class="my-4">
    <a href="/logout" class="btn logout-btn btn-custom">Logout</a>
</div>
</body>
</html>
