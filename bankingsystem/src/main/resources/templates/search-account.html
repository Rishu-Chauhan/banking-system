<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body style="text-align:center; background-color:#faf0e6;">
<h2>🔍 Search Results</h2>

<div th:if="${message}">
    <p th:text="${message}" style="color:red;"></p>
</div>

<!-- ✅ If a single account (search by account number) -->
<div th:if="${account}">
    <h3>Account Details</h3>
    <table border="1" style="margin: 0 auto;">
        <tr><th>Account Number</th><td th:text="${account.accountNumber}"></td></tr>
        <tr><th>Customer Name</th><td th:text="${account.customer.name}"></td></tr>
        <tr><th>Email</th><td th:text="${account.customer.email}"></td></tr>
        <tr><th>Phone</th><td th:text="${account.customer.phone}"></td></tr>
        <tr><th>Balance</th><td th:text="${account.balance}"></td></tr>
    </table>
</div>

<!-- ✅ If multiple accounts (search by name) -->
<div th:if="${accounts}">
    <h3>Accounts List</h3>
    <table border="1" style="margin: 0 auto;">
        <tr>
            <th>Account Number</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Balance</th>
        </tr>
        <tr th:each="acc : ${accounts}">
            <td th:text="${acc.accountNumber}"></td>
            <td th:text="${acc.customer.name}"></td>
            <td th:text="${acc.customer.email}"></td>
            <td th:text="${acc.customer.phone}"></td>
            <td th:text="${acc.balance}"></td>
        </tr>
    </table>
</div>

<br>
<a href="/account/search">🔙 Back to Search</a>
</body>
</html>
