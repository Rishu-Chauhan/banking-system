<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <h2 class="text-center mb-4">Transaction History</h2>

    <div class="text-end mb-3">
        <a href="/account/list" class="btn btn-secondary">Back to Accounts</a>
    </div>

    <!-- Display message or error -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Account Number</th>
            <th>Amount (₹)</th>
            <th>Date & Time</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(transactions)}">
            <td colspan="6" class="text-center">No transactions found</td>
        </tr>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.type}"></td>
            <td th:text="${t.account != null ? t.account.accountNumber : 'N/A'}"></td>
            <td th:text="${t.amount}"></td>
            <td th:text="${t.dateTime}"></td>
            <td th:text="${t.details != null ? t.details : ''}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
