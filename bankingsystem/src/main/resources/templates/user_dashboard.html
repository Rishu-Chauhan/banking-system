<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #a5d6a7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .dashboard-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 500px;
            max-width: 90%;
        }

        .dashboard-card h1 {
            color: #2e7d32;
            font-weight: 700;
        }

        .btn-custom {
            min-width: 180px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .logout-btn {
            background-color: #e53935;
            color: white;
        }

        .logout-btn:hover {
            background-color: #c62828;
        }
    </style>
</head>

<body>
<div class="dashboard-card text-center">
    <h1>💰 User Dashboard</h1>
    <p class="lead mb-4">Welcome! You can manage your banking activities here.</p>

    <div class="d-grid gap-3">
        <a href="/account/list" class="btn btn-outline-primary btn-custom">My Accounts</a>
        <a href="/account/transfer" class="btn btn-outline-success btn-custom">Transfer Money</a>
        <a href="/account/transactions" class="btn btn-outline-info btn-custom">Transaction History</a>
    </div>

    <hr class="my-4">

    <a href="/logout" class="btn logout-btn btn-custom">Logout</a>
</div>
</body>
</html>
